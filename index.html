<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alkhair.Catering and Drinks.Kano</title>
  <link rel="stylesheet" href="style.css">
  <style>
    [hidden] { display: none !important; }
    .card { cursor: pointer; }
    .card .p-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .logo { height: 38px; width: auto; max-width: 90px; object-fit: contain; border-radius: 6px; background: #fff; padding: 2px; }
    .hright { display: flex; gap: 10px; align-items: center; }
    .hright a { color: #fff; font-size: 14px; }
    .hello { font-size: 13px; color: #ffd9a8; }
    .auth-btn { background: transparent; color: #fff; border: 1px solid #fff; padding: 6px 12px;
      border-radius: 20px; font-size: 14px; cursor: pointer; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30;
      display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #fff; border-radius: 14px; padding: 22px; width: 100%; max-width: 360px;
      position: relative; display: flex; flex-direction: column; gap: 10px; max-height: 95vh; overflow-y: auto; }
    .modal-box .x { position: absolute; top: 10px; right: 12px; z-index: 2; }
    .modal-box input { padding: 11px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; width: 100%; }
    .modal-box form { display: flex; flex-direction: column; gap: 10px; }
    .google-btn { background: #fff; border: 1px solid #ccc; padding: 11px; border-radius: 8px;
      font-size: 15px; cursor: pointer; }
    .or { text-align: center; color: #999; font-size: 13px; }
    .auth-note { background: #fff4e5; color: #8a4b00; padding: 10px; border-radius: 8px; font-size: 14px; }
    .auth-msg { font-size: 14px; min-height: 18px; }
    .auth-msg.err { color: #b00020; }
    .auth-msg.ok { color: #1b6b3a; }
    .switch { text-align: center; font-size: 14px; }
    .switch a { color: #1b6b3a; font-weight: bold; }

    .p-emoji { font-size: 70px; text-align: center; }
    .p-big { width: 100%; max-height: 230px; object-fit: cover; border-radius: 10px; }
    .p-cat { text-align: center; color: #888; font-size: 13px; margin-top: -6px; }
    #prodName { text-align: center; }
    .p-price { text-align: center; color: #1b6b3a; font-size: 22px; font-weight: bold; }
    .p-qty { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 4px 0; }
    .p-qty button { width: 38px; height: 38px; border: 1px solid #ccc; background: #fff;
      border-radius: 50%; font-size: 20px; cursor: pointer; }
    .p-qty span { font-size: 20px; font-weight: bold; min-width: 24px; text-align: center; }

    .ci-img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; margin-right: 8px; }
    .ci-left { display: flex; align-items: center; }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40;
      background: #1b6b3a; color: #fff; padding: 12px 16px; border-radius: 12px; display: flex;
      gap: 14px; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.3);
      max-width: calc(100% - 24px); font-size: 15px; }
    .toast button { background: #fff; color: #1b6b3a; border: 0; padding: 6px 12px; border-radius: 8px;
      font-weight: bold; cursor: pointer; white-space: nowrap; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img id="logo" class="logo" alt="Logo" hidden>
      <h1>Alkhair <span>Catering and Drinks.kano</span></h1>
    </div>
    <div class="hright">
      <span id="hello" class="hello"></span>
      <a href="orders.html">My orders</a>
      <button id="authBtn" class="auth-btn">Login</button>
      <button id="openCart" class="cart-btn">🛒 Cart <b id="cartCount">0</b></button>
    </div>
  </header>

  <section class="hero">
    <h2>Fresh food, delivered to you</h2>
    <p>Order online for delivery or pickup.</p>
    <a class="catering" id="cateringLink" href="#" target="_blank">Catering enquiry (events &amp; parties)</a>
  </section>

  <nav id="tabs" class="tabs"></nav>
  <main id="menu" class="menu"><p class="empty">Loading menu...</p></main>

  <footer class="foot">© Kwaido and More Catering · <a href="track.html" style="color:inherit">Track an order</a></footer>

  <div id="overlay" class="overlay"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <h3>Your order</h3>
      <button id="closeCart" class="x">✕</button>
    </div>

    <div id="cartView">
      <div id="cartItems" class="cart-items"></div>
      <form id="checkout" class="checkout">
        <div class="row">
          <label><input type="radio" name="mode" value="delivery" checked> Delivery</label>
          <label><input type="radio" name="mode" value="pickup"> Pickup</label>
        </div>
        <input id="name" placeholder="Your name">
        <input id="phone" type="tel" placeholder="Phone number">
        <textarea id="address" placeholder="Delivery address" rows="2"></textarea>
        <textarea id="notes" placeholder="Notes (optional)" rows="2"></textarea>

        <div class="totals">
          <div><span>Subtotal</span><span id="subtotal">₦0</span></div>
          <div><span>Delivery fee</span><span id="fee">₦0</span></div>
          <div class="grand"><span>Total</span><span id="total">₦0</span></div>
        </div>
        <button type="submit" id="submitBtn" class="order-btn">Log in to place order</button>
      </form>
    </div>

    <div id="done" style="display:none"></div>
  </aside>

  <!-- Product popup -->
  <div id="prodModal" class="modal" hidden>
    <div class="modal-box">
      <button id="closeProd" class="x">✕</button>
      <img id="prodImg" class="p-big" alt="" hidden>
      <div id="prodEmoji" class="p-emoji"></div>
      <h3 id="prodName"></h3>
      <div id="prodCat" class="p-cat"></div>
      <div id="prodPrice" class="p-price"></div>
      <div class="p-qty">
        <button type="button" id="pMinus">−</button>
        <span id="pQty">1</span>
        <button type="button" id="pPlus">+</button>
      </div>
      <button type="button" id="pAdd" class="order-btn">Add to cart</button>
    </div>
  </div>

  <!-- Login / signup popup -->
  <div id="authModal" class="modal" hidden>
    <div class="modal-box">
      <button id="closeAuth" class="x">✕</button>
      <h3 id="authTitle">Log in</h3>
      <p id="authNote" class="auth-note" hidden></p>
      <button type="button" id="googleBtn" class="google-btn">Continue with Google</button>
      <div class="or">or use your email</div>
      <form id="authForm">
        <input id="a-name" placeholder="Full name" hidden>
        <input id="a-phone" type="tel" placeholder="Phone number" hidden>
        <input id="a-email" type="email" placeholder="Email" required>
        <input id="a-password" type="password" placeholder="Password (min 6 characters)" minlength="6" required>
        <button type="submit" id="authSubmit" class="order-btn">Log in</button>
      </form>
      <div id="authMsg" class="auth-msg"></div>
      <div id="authSwitch" class="switch"></div>
    </div>
  </div>

  <!-- "Added to cart" message -->
  <div id="toast" class="toast" hidden>
    <span id="toastText"></span>
    <button type="button" id="toastView">View cart</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
