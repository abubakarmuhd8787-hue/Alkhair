<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My orders - Alkhair Drinks Catering Kano</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #faf7f2; color: #222; }
    header { background: #1b6b3a; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    header a { color: #fff; }
    main { max-width: 560px; margin: 0 auto; padding: 18px 14px 40px; }
    h2 { margin-bottom: 14px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .code { font-weight: bold; font-size: 17px; color: #1b6b3a; letter-spacing: 1px; }
    .date { color: #888; font-size: 13px; margin: 2px 0 8px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 13px; color: #fff; background: #888; }
    .badge.New { background: #e8801a; }
    .badge.Preparing { background: #2b6fd6; }
    .badge.On-The-Way { background: #7b3fc4; }
    .badge.Ready { background: #1b6b3a; }
    .badge.Delivered { background: #1b6b3a; }
    .badge.Cancelled { background: #b00020; }
    ul { margin: 8px 0 8px 18px; }
    .total { font-weight: bold; margin-top: 6px; }
    .rider { margin-top: 6px; color: #444; }
    .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .btn { display: inline-block; border: 0; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer;
      text-decoration: none; background: #1b6b3a; color: #fff; }
    .btn.alt { background: #e8801a; }
    .empty { text-align: center; color: #888; padding: 24px 0; }
  </style>
</head>
<body>
  <header><b>Alkhair Drinks</b><a href="index.html">Back to menu</a></header>
  <main>
    <h2>My orders</h2>
    <div id="list"><p class="empty">Loading...</p></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const naira = n => "₦" + Number(n).toLocaleString();
    let ORDERS = [];
    let timer = null;

    function orderHtml(o, idx) {
      const statusClass = String(o.status).replace(/\s+/g, "-");
      return `<div class="card">
        <div class="top">
          <span class="code">${esc(o.code)}</span>
          <span class="badge ${esc(statusClass)}">${esc(o.status)}</span>
        </div>
        <div class="date">${new Date(o.created_at).toLocaleString()} · ${o.mode === "delivery" ? "Delivery" : "Pickup"}</div>
        <ul>${o.items.map(i => `<li>${i.qty} x ${esc(i.name)}</li>`).join("")}</ul>
        <div class="total">Total: ${naira(o.total)}</div>
        ${o.rider && o.status !== "Delivered" && o.status !== "Cancelled" ? `<div class="rider">🛵 Rider: <b>${esc(o.rider)}</b></div>` : ""}
        <div class="actions">
          <a class="btn" href="track.html?code=${encodeURIComponent(o.code)}">Track</a>
          <button class="btn alt" data-idx="${idx}">Order again</button>
        </div>
      </div>`;
    }

    async function load() {
      clearTimeout(timer);
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        $("list").innerHTML = `<div class="card">
          <p>Please log in to see your orders.</p>
          <div class="actions"><a class="btn" href="index.html">Go to the shop to log in</a></div>
        </div>`;
        return;
      }
      const { data, error } = await sb.from("orders").select("*")
        .eq("user_id", session.user.id)
        .order("created_at", { ascending: false }).limit(50);
      if (error) { $("list").innerHTML = `<p class="empty">Could not load your orders. Please refresh.</p>`; return; }
      ORDERS = data;
      $("list").innerHTML = data.length
        ? data.map(orderHtml).join("")
        : `<p class="empty">You have no orders yet.</p>`;

      if (data.some(o => o.status !== "Delivered" && o.status !== "Cancelled")) {
        timer = setTimeout(load, 20000);
      }
    }

    $("list").onclick = e => {
      const btn = e.target.closest("button[data-idx]");
      if (!btn) return;
      const o = ORDERS[Number(btn.dataset.idx)];
      if (!o) return;
      let cart = {};
      try { cart = JSON.parse(localStorage.getItem("kwaido_cart")) || {}; } catch (err) { cart = {}; }
      o.items.forEach(i => { cart[i.id] = Math.min(50, (cart[i.id] || 0) + i.qty); });
      try { localStorage.setItem("kwaido_cart", JSON.stringify(cart)); } catch (err) {}
      location.href = "index.html";
    };

    load();
  </script>
</body>
</html>
